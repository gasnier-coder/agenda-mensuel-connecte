<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Senior - GASNIER TECH</title>
  
  <!-- Liaison PWA Manifest & Icônes -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SDK Firebase JS (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    /* Verrouillage strict de l'écran sans aucun scroll */
    html, body {
      height: 100vh;
      max-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #121212;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    /* Grille mensuelle adaptative */
    .grid-month {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      height: 100%;
    }

    .grid-rows-5 { grid-template-rows: repeat(5, 1fr); }
    .grid-rows-6 { grid-template-rows: repeat(6, 1fr); }

    /* Utilitaires visuels */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden p-2">

  <!-- En-tête (Header) avec ton Logo -->
  <header class="flex items-center justify-between bg-black/70 border-2 border-[#00E5FF] rounded-xl px-4 py-2 mb-2 shrink-0">
    
    <!-- Zone Logo -->
    <div class="flex items-center gap-4">
      <div class="border-2 border-[#00FF66] bg-black px-2 py-1 rounded-lg flex items-center justify-center shadow-[0_0_10px_rgba(0,255,102,0.3)] h-12">
        <img src="logo.png" alt="GASNIER TECH" class="max-h-10 object-contain" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='flex';">
        <div id="fallback-logo" class="hidden flex-col justify-center items-center px-2">
          <span class="text-sm font-black text-[#00FF66] tracking-widest leading-none">GASNIER</span>
          <span class="text-[10px] font-bold text-[#00E5FF] tracking-widest leading-none mt-1">TECH</span>
        </div>
      </div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-[#00FF66] tracking-wide" id="current-month-title">
        CHARGEMENT...
      </h1>
    </div>

    <!-- Navigation & Bouton Aujourd'hui -->
    <div class="flex items-center gap-2 md:gap-4">
      <button onclick="changeMonth(-1)" class="bg-gray-800 hover:bg-gray-700 text-[#00E5FF] border-2 border-[#00E5FF] text-xl md:text-2xl font-black px-4 py-1.5 rounded-xl active:scale-95 transition-transform">
        &#9664; MOIS PRÉCÉDENT
      </button>
      
      <button onclick="goToToday()" class="bg-[#FF0055] hover:bg-red-600 text-white font-black text-lg md:text-xl px-5 py-2 rounded-xl shadow-lg border-2 border-white active:scale-95 transition-transform">
        AUJOURD'HUI
      </button>

      <button onclick="changeMonth(1)" class="bg-gray-800 hover:bg-gray-700 text-[#00E5FF] border-2 border-[#00E5FF] text-xl md:text-2xl font-black px-4 py-1.5 rounded-xl active:scale-95 transition-transform">
        MOIS SUIVANT &#9654;
      </button>
    </div>
  </header>

  <!-- En-tête des jours de la semaine -->
  <div class="grid grid-cols-7 gap-1 text-center font-black text-lg md:text-xl text-[#FFE600] bg-gray-900 py-1.5 rounded-lg border border-gray-800 mb-1 shrink-0">
    <div>LUN</div>
    <div>MAR</div>
    <div>MER</div>
    <div>JEU</div>
    <div>VEN</div>
    <div>SAM</div>
    <div>DIM</div>
  </div>

  <!-- Conteneur principal de la Grille Mensuelle (100% de la hauteur restante) -->
  <main class="flex-1 min-h-0 w-full relative">
    <div id="calendar-grid" class="grid-month gap-1 h-full w-full">
      <!-- Injection dynamique des jours -->
    </div>
  </main>

  <!-- Modale Détails / Ajout de Rendez-vous -->
  <div id="day-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-gray-900 border-4 border-[#00FF66] rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col p-6 shadow-2xl">
      
      <!-- Titre Modale -->
      <div class="flex justify-between items-center border-b-2 border-gray-700 pb-3 mb-4 shrink-0">
        <div>
          <h2 id="modal-date-title" class="text-2xl md:text-3xl font-black text-[#FFE600]">
            DÉTAILS DU JOUR
          </h2>
          <p id="modal-holiday-subtitle" class="text-lg font-bold text-[#FF77FF] mt-1 hidden"></p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-4xl font-bold px-3">
          &times;
        </button>
      </div>

      <!-- Formulaire d'ajout rapide -->
      <form id="event-form" onsubmit="saveEvent(event)" class="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-4 shrink-0">
        <input type="hidden" id="event-id">
        <div class="flex flex-col md:flex-row gap-3">
          <input type="time" id="event-time" required class="bg-black text-white text-xl font-bold p-3 rounded-lg border border-[#00E5FF] focus:outline-none">
          <input type="text" id="event-title" placeholder="Rendez-vous (ex: Docteur, Coiffeur...)" required class="flex-1 bg-black text-white text-xl p-3 rounded-lg border border-[#00E5FF] focus:outline-none placeholder-gray-500">
          <button type="submit" class="bg-[#00FF66] hover:bg-green-400 text-black font-black text-xl px-6 py-3 rounded-lg transition-colors">
            AJOUTER
          </button>
        </div>
      </form>

      <!-- Liste des RDV du jour -->
      <div id="modal-events-list" class="flex-1 overflow-y-auto no-scrollbar space-y-3 pr-1">
        <!-- Liste dynamique -->
      </div>

      <!-- Bouton Fermer -->
      <button onclick="closeModal()" class="mt-4 w-full bg-gray-700 hover:bg-gray-600 text-white font-black text-xl py-3 rounded-xl border border-gray-500 shrink-0">
        FERMER
      </button>
    </div>
  </div>
